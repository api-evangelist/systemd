openapi: 3.1.0
info:
  title: systemd-hostnamed (org.freedesktop.hostname1) Boot PCR API
  version: '1.0'
  summary: D-Bus API of systemd-hostnamed modeled as REST operations.
  description: 'Documentation/contract artifact for the `org.freedesktop.hostname1` D-Bus interface on the

    system bus. Manages the system hostname (static, transient, pretty), chassis type, deployment,

    location, icon name, and other machine info.

    '
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: dbus://system/org.freedesktop.hostname1
tags:
- name: PCR
paths:
  /io.systemd.PCRExtend/Extend:
    post:
      tags:
      - PCR
      operationId: PCRExtend
      summary: Extend A TPM2 PCR
      description: Calls `io.systemd.PCRExtend.Extend`. Extends the named PCR with the supplied data.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pcr
              - data
              properties:
                pcr:
                  type: integer
                banks:
                  type: array
                  items:
                    type: string
                data:
                  type: string
                  contentEncoding: base64
      responses:
        '204':
          description: PCR extended.
