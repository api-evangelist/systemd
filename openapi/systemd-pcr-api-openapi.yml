openapi: 3.2.0
info:
  title: systemd Varlink Interfaces (io.systemd.*) PCR API
  version: '1.0'
  summary: Varlink IPC surface exposed by systemd daemons modeled as REST operations.
  description: 'Documentation/contract artifact modeling the family of `io.systemd.*` Varlink interfaces

    exposed by systemd daemons through AF_UNIX sockets under `/run/systemd/io.systemd.*`.'
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: varlink://run/systemd/io.systemd
tags:
- name: PCR
paths:
  /io.systemd.PCRExtend/Extend:
    post:
      tags:
      - PCR
      operationId: PCRExtend
      summary: Extend A TPM2 PCR
      description: Calls `io.systemd.PCRExtend.Extend`. Extends the named PCR with the supplied data.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pcr
              - data
              properties:
                pcr:
                  type: integer
                banks:
                  type: array
                  items:
                    type: string
                data:
                  type: string
                  contentEncoding: base64
      responses:
        '204':
          description: PCR extended.
