openapi: 3.2.0
info:
  title: Systemd Configuration API
  version: '1.0'
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
  description: 'Operations tagged Configuration across 2 of this provider''s published API definitions: resolve1-openapi.yml, systemd1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: dbus://system/org.freedesktop.resolve1
- url: dbus://system/org.freedesktop.systemd1
  description: System D-Bus (PID 1)
tags:
- name: Configuration
paths:
  /links/{ifindex}/dns:
    parameters:
    - name: ifindex
      in: path
      required: true
      schema:
        type: integer
    put:
      tags:
      - Configuration
      operationId: SetLinkDNS
      summary: Set DNS Servers On A Link
      description: Mirrors `SetLinkDNS(ifindex, servers)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                servers:
                  type: array
                  items:
                    type: object
                    properties:
                      family:
                        type: integer
                      address:
                        type: array
                        items:
                          type: integer
      responses:
        '204':
          description: Updated.
    servers:
    - url: dbus://system/org.freedesktop.resolve1
  /links/{ifindex}/dnssec:
    parameters:
    - name: ifindex
      in: path
      required: true
      schema:
        type: integer
    put:
      tags:
      - Configuration
      operationId: SetLinkDNSSEC
      summary: Set DNSSEC Mode On A Link
      description: Mirrors `SetLinkDNSSEC(ifindex, mode)`. Mode is `yes`, `no`, or `allow-downgrade`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - true
                  - false
                  - allow-downgrade
      responses:
        '204':
          description: Updated.
    servers:
    - url: dbus://system/org.freedesktop.resolve1
  /links/{ifindex}/dns-over-tls:
    parameters:
    - name: ifindex
      in: path
      required: true
      schema:
        type: integer
    put:
      tags:
      - Configuration
      operationId: SetLinkDNSOverTLS
      summary: Set DNS-over-TLS Mode On A Link
      description: Mirrors `SetLinkDNSOverTLS(ifindex, mode)`. Mode is `yes`, `no`, or `opportunistic`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - true
                  - false
                  - opportunistic
      responses:
        '204':
          description: Updated.
    servers:
    - url: dbus://system/org.freedesktop.resolve1
  /manager/reload:
    post:
      tags:
      - Configuration
      operationId: Reload
      summary: Reload Manager Configuration
      description: Reloads all unit files from disk without restarting services. Mirrors `Reload()`.
      responses:
        '204':
          description: Reloaded.
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/reexecute:
    post:
      tags:
      - Configuration
      operationId: Reexecute
      summary: Reexecute The Manager
      description: Re-executes the systemd binary in-place, preserving state. Mirrors `Reexecute()`.
      responses:
        '204':
          description: Reexecuted.
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/enable:
    post:
      tags:
      - Configuration
      operationId: EnableUnitFiles
      summary: Enable Unit Files
      description: Creates the symlinks that make units start at boot. Mirrors `EnableUnitFiles(files, runtime, force)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                runtime:
                  type: boolean
                force:
                  type: boolean
      responses:
        '200':
          description: Carries-install info and change set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/disable:
    post:
      tags:
      - Configuration
      operationId: DisableUnitFiles
      summary: Disable Unit Files
      description: Removes the symlinks that make units start at boot. Mirrors `DisableUnitFiles(files, runtime)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                runtime:
                  type: boolean
      responses:
        '200':
          description: Change set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/mask:
    post:
      tags:
      - Configuration
      operationId: MaskUnitFiles
      summary: Mask Unit Files
      description: Symlinks units to /dev/null so they cannot be started. Mirrors `MaskUnitFiles(files, runtime, force)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                runtime:
                  type: boolean
                force:
                  type: boolean
      responses:
        '200':
          description: Change set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/unmask:
    post:
      tags:
      - Configuration
      operationId: UnmaskUnitFiles
      summary: Unmask Unit Files
      description: Reverses MaskUnitFiles. Mirrors `UnmaskUnitFiles(files, runtime)`.
      responses:
        '200':
          description: Change set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/set-default-target:
    post:
      tags:
      - Configuration
      operationId: SetDefaultTarget
      summary: Set The Default Boot Target
      description: Mirrors `SetDefaultTarget(target, force)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                force:
                  type: boolean
      responses:
        '200':
          description: Change set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
  /manager/default-target:
    get:
      tags:
      - Configuration
      operationId: GetDefaultTarget
      summary: Get The Default Boot Target
      description: Mirrors `GetDefaultTarget()`.
      responses:
        '200':
          description: Target unit name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  target:
                    type: string
    servers:
    - url: dbus://system/org.freedesktop.systemd1
      description: System D-Bus (PID 1)
x-refined-from:
- resolve1-openapi.yml
- systemd1-openapi.yml
