openapi: 3.2.0
info:
  title: systemd Varlink Interfaces (io.systemd.*) Resolve API
  version: '1.0'
  summary: Varlink IPC surface exposed by systemd daemons modeled as REST operations.
  description: 'Documentation/contract artifact modeling the family of `io.systemd.*` Varlink interfaces

    exposed by systemd daemons through AF_UNIX sockets under `/run/systemd/io.systemd.*`.'
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: varlink://run/systemd/io.systemd
tags:
- name: Resolve
paths:
  /io.systemd.Resolve/ResolveHostname:
    post:
      tags:
      - Resolve
      operationId: VarlinkResolveHostname
      summary: Resolve A Hostname (Varlink)
      description: Calls `io.systemd.Resolve.ResolveHostname`. Newer JSON-native equivalent of the D-Bus ResolveHostname.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                ifindex:
                  type: integer
                name:
                  type: string
                family:
                  type: integer
                flags:
                  type: integer
      responses:
        '200':
          description: Resolved addresses.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
