openapi: 3.2.0
info:
  title: systemd Manager (org.freedesktop.systemd1) Jobs API
  version: '1.0'
  summary: D-Bus API of PID 1 (the systemd Manager) modeled as REST operations.
  description: 'This OpenAPI document models the well-known systemd D-Bus interface set at bus name

    `org.freedesktop.systemd1` (system bus).'
  contact:
    name: systemd developers
    url: https://lists.freedesktop.org/mailman/listinfo/systemd-devel
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: dbus://system/org.freedesktop.systemd1
  description: System D-Bus (PID 1)
tags:
- name: Jobs
  description: Pending and active jobs scheduled by the Manager.
paths:
  /jobs:
    get:
      tags:
      - Jobs
      operationId: ListJobs
      summary: List Pending And Running Jobs
      description: Mirrors `ListJobs()`.
      responses:
        '200':
          description: Array of jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      tags:
      - Jobs
      operationId: CancelJob
      summary: Cancel A Pending Job
      description: Mirrors `CancelJob(id)`.
      responses:
        '204':
          description: Job cancelled.
components:
  schemas:
    Job:
      type: object
      properties:
        id:
          type: integer
        unit:
          type: string
        type:
          type: string
          enum:
          - start
          - verify-active
          - stop
          - reload
          - restart
          - try-restart
          - reload-or-start
        state:
          type: string
          enum:
          - waiting
          - running
        object_path:
          type: string
        unit_object_path:
          type: string
