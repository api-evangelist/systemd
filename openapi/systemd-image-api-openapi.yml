openapi: 3.2.0
info:
  title: systemd Varlink Interfaces (io.systemd.*) Image API
  version: '1.0'
  summary: Varlink IPC surface exposed by systemd daemons modeled as REST operations.
  description: 'Documentation/contract artifact modeling the family of `io.systemd.*` Varlink interfaces

    exposed by systemd daemons through AF_UNIX sockets under `/run/systemd/io.systemd.*`.'
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: varlink://run/systemd/io.systemd
tags:
- name: Image
paths:
  /io.systemd.MachineImage/List:
    post:
      tags:
      - Image
      operationId: MachineImageList
      summary: List Machine Images (Varlink)
      description: Calls `io.systemd.MachineImage.List`. JSON-native equivalent of machined's ListImages.
      responses:
        '200':
          description: Array of image records.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
