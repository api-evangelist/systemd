openapi: 3.1.0
info:
  title: systemd-hostnamed (org.freedesktop.hostname1) Boot Cache API
  version: '1.0'
  summary: D-Bus API of systemd-hostnamed modeled as REST operations.
  description: 'Documentation/contract artifact for the `org.freedesktop.hostname1` D-Bus interface on the

    system bus. Manages the system hostname (static, transient, pretty), chassis type, deployment,

    location, icon name, and other machine info.

    '
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: dbus://system/org.freedesktop.hostname1
tags:
- name: Cache
paths:
  /cache/flush:
    post:
      tags:
      - Cache
      operationId: FlushCaches
      summary: Flush All DNS Caches
      description: Mirrors `FlushCaches()`.
      responses:
        '204':
          description: Cache flushed.
  /cache/reset-server-features:
    post:
      tags:
      - Cache
      operationId: ResetServerFeatures
      summary: Reset Server Feature Detection
      description: Mirrors `ResetServerFeatures()`.
      responses:
        '204':
          description: Reset.
