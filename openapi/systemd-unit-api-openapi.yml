openapi: 3.2.0
info:
  title: systemd Varlink Interfaces (io.systemd.*) Unit API
  version: '1.0'
  summary: Varlink IPC surface exposed by systemd daemons modeled as REST operations.
  description: 'Documentation/contract artifact modeling the family of `io.systemd.*` Varlink interfaces

    exposed by systemd daemons through AF_UNIX sockets under `/run/systemd/io.systemd.*`.'
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: varlink://run/systemd/io.systemd
tags:
- name: Unit
paths:
  /io.systemd.Manager/ListUnits:
    post:
      tags:
      - Unit
      operationId: ManagerListUnits
      summary: List All Units
      description: Calls `io.systemd.Manager.ListUnits`. Returns an iterable stream of unit records.
      responses:
        '200':
          description: Streamed unit records.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /io.systemd.Unit/Describe:
    post:
      tags:
      - Unit
      operationId: UnitDescribe
      summary: Describe A Single Unit
      description: Calls `io.systemd.Unit.Describe`. Returns the full property bag for one unit.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - unit
              properties:
                unit:
                  type: string
      responses:
        '200':
          description: Unit description.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
