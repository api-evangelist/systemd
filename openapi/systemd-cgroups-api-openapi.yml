openapi: 3.2.0
info:
  title: systemd Manager (org.freedesktop.systemd1) Cgroups API
  version: '1.0'
  summary: D-Bus API of PID 1 (the systemd Manager) modeled as REST operations.
  description: 'This OpenAPI document models the well-known systemd D-Bus interface set at bus name

    `org.freedesktop.systemd1` (system bus).'
  contact:
    name: systemd developers
    url: https://lists.freedesktop.org/mailman/listinfo/systemd-devel
  license:
    name: LGPL-2.1-or-later
    url: https://github.com/systemd/systemd/blob/main/LICENSES/LGPL-2.1-or-later.txt
servers:
- url: dbus://system/org.freedesktop.systemd1
  description: System D-Bus (PID 1)
tags:
- name: Cgroups
  description: Transient unit creation and cgroup-backed resource control.
paths:
  /units/transient:
    post:
      tags:
      - Cgroups
      operationId: StartTransientUnit
      summary: Start A Transient Unit
      description: Creates and starts a new transient unit (typically a scope or service) with the supplied properties. Mirrors `StartTransientUnit(name, mode, properties, aux)`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - mode
              properties:
                name:
                  type: string
                mode:
                  type: string
                  enum:
                  - replace
                  - fail
                  - isolate
                  - ignore-dependencies
                  - ignore-requirements
                properties:
                  type: object
                  additionalProperties: true
                aux:
                  type: array
                  items:
                    type: object
      responses:
        '202':
          description: Job enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPath'
components:
  schemas:
    JobPath:
      type: object
      properties:
        path:
          type: string
          description: D-Bus object path of the job.
